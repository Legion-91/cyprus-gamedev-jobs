name: Collect jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect vacancies
        run: python collect_jobs.py

      - name: Remove retired Pixonic rows
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/jobs.csv')
          if p.exists() and p.stat().st_size:
              with p.open(encoding='utf-8', newline='') as f:
                  r=csv.DictReader(f); fields=r.fieldnames; rows=[x for x in r if x.get('company')!='Pixonic']
              with p.open('w', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY

      - name: Build mobile site
        run: python build_site.py

      - name: Commit vacancies and site
        run: |
          if git diff --quiet -- data/jobs.csv docs; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv docs
          git commit -m "Update vacancies and mobile site"
          git push
