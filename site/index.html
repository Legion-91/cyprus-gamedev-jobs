<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Cyprus GameDev Jobs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 14px 50px}h1{font-size:28px;margin:8px 0 3px}.sub{color:#666;margin:0 0 18px}.controls{position:sticky;top:0;background:#f5f5f5;padding:8px 0 12px;z-index:2}.search,select{width:100%;font:inherit;border:1px solid #ddd;background:white;border-radius:12px;padding:13px 14px;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.count{font-size:14px;color:#666;margin:5px 2px 10px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e6e6e6;border-radius:15px;padding:16px;margin:9px 0}.company{font-size:13px;font-weight:700;color:#666;margin-bottom:6px}.title{font-size:18px;font-weight:700;line-height:1.25}.meta{font-size:14px;color:#666;margin-top:9px;line-height:1.4}.new{display:inline-block;font-size:11px;font-weight:700;background:#e9e9e9;border-radius:6px;padding:3px 6px;margin-left:6px;vertical-align:2px}.empty{text-align:center;color:#777;padding:40px 10px}@media(max-width:480px){.wrap{padding-top:12px}h1{font-size:25px}.row{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<h1>Cyprus GameDev Jobs</h1><p class="sub">Вакансии игровых компаний Кипра</p>
<div class="controls"><input id="q" class="search" autocomplete="off" placeholder="Поиск: producer, дизайнер, unity, qa..."><div class="row"><select id="company"><option value="">Все компании</option></select><select id="age"><option value="">За всё время</option><option value="1">Новые за сутки</option><option value="3">Новые за 3 дня</option><option value="7">Новые за неделю</option></select></div></div>
<div id="count" class="count">Загрузка вакансий...</div><div id="jobs"></div>
</main>
<script>
let all=[];const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const aliasGroups=[['producer','продюсер'],['artist','художник'],['designer','дизайнер'],['game designer','геймдизайнер','gameplay designer','level designer','level design','гейм дизайнер'],['developer','разработчик','engineer','инженер','programmer','программист'],['unity','unity3d'],['unreal','ue4','ue5','unreal engine'],['qa','quality assurance','tester','тестировщик','тестирование'],['analyst','analytics','аналитик','аналитика','data analyst'],['marketing','маркетинг','marketer','маркетолог','user acquisition'],['community','community manager','комьюнити'],['support','customer support','player support','поддержка'],['hr','human resources','recruiter','recruitment','рекрутер','рекрутинг','кадры'],['project manager','проектный менеджер','менеджер проекта'],['product manager','product owner','продуктовый менеджер'],['2d','2d artist','2d художник'],['3d','3d artist','3d художник','modeler','modeller'],['animation','animator','аниматор','анимация'],['ui','ux','ui/ux','interface','интерфейс'],['vfx','visual effects','effects artist','эффекты'],['technical artist','tech artist','технический художник'],['sound','audio','sound designer','audio designer','звук','саунд дизайнер'],['writer','narrative','narrative designer','сценарист','нарратив'],['backend','back-end','server','серверный'],['frontend','front-end','client','клиентский'],['devops','sre','infrastructure','инфраструктура'],['lead','team lead','лид'],['director','head','директор','руководитель'],['senior','старший'],['junior','младший','intern','internship','стажер','стажёр']];
function calendarDays(d){if(!d)return 99999;const x=new Date(d),now=new Date();const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());const b=new Date(x.getFullYear(),x.getMonth(),x.getDate());return Math.round((a-b)/86400000)}
function dateLabel(d){if(!d)return'';const n=calendarDays(d);if(n<=0)return'сегодня';if(n===1)return'вчера';return n+' дн. назад'}
function normalize(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[,_;|\/]+/g,' ').replace(/\s+/g,' ').trim()}
function queryVariants(q){const n=normalize(q);if(!n)return[];const matched=aliasGroups.filter(g=>g.some(a=>normalize(a).startsWith(n)||n.startsWith(normalize(a))));if(!matched.length)return[n];return[...new Set(matched.flat().map(normalize))]}
function matchesSearch(job,q){const variants=queryVariants(q);if(!variants.length)return true;const h=normalize([job.title,job.company,job.location].join(' '));return variants.some(t=>h.includes(t))}
function render(){const q=$('q').value,c=$('company').value,a=Number($('age').value||0);const rows=all.filter(j=>(!c||j.company===c)&&(!a||calendarDays(j.first_seen)<a)&&matchesSearch(j,q));$('count').textContent='Загружено: '+all.length+' · Показано: '+rows.length;$('jobs').innerHTML=rows.length?rows.map(j=>`<a class="card" href="${esc(j.url)}" target="_blank" rel="noopener"><div class="company">${esc(j.company)}</div><div class="title">${esc(j.title)}${calendarDays(j.first_seen)<3?'<span class="new">NEW</span>':''}</div><div class="meta">${esc(j.location||'Локация не указана')}${j.first_seen?' · '+esc(dateLabel(j.first_seen)):''}</div></a>`).join(''):'<div class="empty">Ничего не найдено</div>'}
async function load(){try{const r=await fetch('./jobs.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw new Error('Invalid jobs data');all=data;$('q').value='';$('age').value='';let cs=[...new Set(all.map(x=>x.company).filter(Boolean))].sort((a,b)=>a.localeCompare(b));$('company').innerHTML='<option value="">Все компании</option>'+cs.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('company').value='';render()}catch(e){$('count').textContent='Ошибка загрузки вакансий';$('jobs').innerHTML='<div class="empty">Не удалось загрузить jobs.json</div>';console.error(e)}}
['q','company','age'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));load();
</script></body></html>
